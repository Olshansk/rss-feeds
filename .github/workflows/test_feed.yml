name: Test Feed Generation

on:
  push:
    branches: [main]
    paths: ["feed_generators/**", "tests/**", "pyproject.toml", "uv.lock", ".github/workflows/test_feed.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies and run test feed
        run: |
          set -e
          uv sync
          PYTHONPATH=feed_generators uv run python -m unittest discover -s tests
          uv run ruff check .
          uv run ruff format --check feed_generators tests
          uv run feed_generators/validate_feeds.py

      - name: Upload test feed artifact
        uses: actions/upload-artifact@v7
        with:
          name: feed_test
          path: feeds/feed_ollama.xml
